# The roadmap's tasks, which stage each belongs to, and what each one
# waited on.
#
# **`../model/entities.yaml` said to populate this category "when most
# tasks carry real dependencies", and that condition has fired.** It was
# written when 4 of 39 tasks declared a dependency; 39 of 45 do now, and
# every one of those names concrete task ids rather than prose. Nothing
# noticed the trigger firing, which is the failure mode
# `docs/practices.md` calls "a checkable trigger still needs somebody to
# check it" -- so populating this is discharging a condition the project
# set itself, not building ahead of a need.
#
# What it buys that the roadmap cannot: `depends_on` edges are checked
# for **cycles**, which prose cannot be, and every edge is checked to
# name a task that exists. A task carries no status here (ADR-006 rule
# 2).
#
# Seeded 2026-09-04 from the roadmap's own `### Dependencies` sections,
# maintained by hand since, and cross-checked against the roadmap by
# `make check-graph`. **Two lists were corrected by hand while seeding,
# and that is why this is not generated**: those sections are prose
# containing task ids rather than lists of them. TASK-040's names
# TASK-027 in order to say it is *not* consumed, and TASK-041's runs on
# into a correction narrative naming TASK-024 and TASK-031b -- read
# mechanically, that pair produces one spurious edge and one spurious
# cycle.

category: features

