    unresolved: >-
      Rendering has no dedicated Capability Level --
      `docs/planning/roadmap.md`'s own Stage/Capability Level table
      marks this row that way, the same "tasks added to whichever Stage
      needs them" pattern it records for Measurements, Diagnostics and
      Export. This stage improves how every Level's demos are read
      rather than unlocking a new one.

