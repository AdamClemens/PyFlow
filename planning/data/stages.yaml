# The roadmap's Stages, and which Capability Level each one serves.
#
# Entity set is `docs/planning/roadmap.md`'s own `# Stage N` headings;
# `serves` edges are that document's own Stage/Capability Level
# correspondence table, which is prose here and typed edges there. A
# Stage carries no status: `adr/ADR-006-knowledge-graph-scope.md` rule 2
# keeps execution status in the roadmap, and `../model/schema.yaml`
# records why there is no status field anywhere in this graph.
#
# Seeded 2026-09-04 from the roadmap and maintained by hand since.
# `make check-graph`'s roadmap cross-check fails if a stage heading has
# no entity here, or an entity here names no heading -- so this is a
# second, checked statement rather than an unwatched copy.

category: stages

entities:
  - id: stage-0
    name: "Stage 0 — Engineering Infrastructure"
    documented_in: docs/planning/roadmap.md
    must_appear_in: docs/planning/roadmap.md
    edges:
      - type: serves
        to: capability-level-0

  - id: stage-1
    name: "Stage 1 — Representing Space"
    documented_in: docs/planning/roadmap.md
