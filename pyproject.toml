[project]
name = "pyflow"
version = "0.0.1"
description = "A modular, field-centric computational fluid dynamics engine."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Adam Clemens", email = "a.j.clemens@hotmail.com" },
]
# Policy (decided 2026-08-15): the version is derived, not chosen first --
# it is the intersection of what the actual dependencies support (chiefly
# the A2c array library and renderer), computed once those are decided,
# not asserted ahead of them. 3.14 was set here provisionally before A2c
# existed and re-derived, still at 3.14, once CuPy/PyTorch/jaxlib were all
# confirmed to ship cp314 wheels the same day -- the number held, the
# reasoning was fixed. After the initial derivation, ongoing policy is
# periodic review: check whether a newer Python benefits PyFlow, upgrade
# when it does, not a fixed floor and not continuous tracking either.
# PyFlow has no external consumers yet, so upgrading stays cheap; revisit
# this whole policy the moment someone else depends on PyFlow. See
# docs/practices.md. Keep this in step with the ruff and mypy settings
# below, and with the CI matrix.
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
# Compute-and-rendering stack, per adr/ADR-004 (class) and adr/ADR-005
# (instances), decided 2026-08-15. No version pins yet -- that is B2's
# job once TASK-000 exists and uv.lock can be generated against real code.
dependencies = [
    "torch",
    "pygfx",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyflow"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
packages = ["pyflow"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
