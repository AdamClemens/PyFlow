[project]
name = "pyflow"
version = "0.0.1"
description = "A modular, field-centric computational fluid dynamics engine."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Adam Clemens", email = "a.j.clemens@hotmail.com" },
]
# Policy (decided 2026-08-15): periodically check whether a newer Python
# would benefit PyFlow and upgrade when it does -- not a fixed floor held
# for its own sake, but not continuous tracking either. PyFlow has no
# external consumers yet, so upgrading is cheap to consider. Revisit the
# moment someone else depends on PyFlow -- at that point a conservative
# floor starts to earn its keep. See docs/practices.md. Keep this in step
# with the ruff and mypy settings below, and with the CI matrix.
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
# No runtime dependencies yet -- Stage 0 has no CFD functionality
# (docs/planning/roadmap.md). Add them as capabilities are implemented.
dependencies = []

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyflow"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
packages = ["pyflow"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
