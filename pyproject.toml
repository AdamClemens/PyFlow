[project]
name = "pyflow"
version = "0.0.1"
description = "A modular, field-centric computational fluid dynamics engine."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Adam Clemens", email = "a.j.clemens@hotmail.com" },
]
# Policy (decided 2026-08-15): the version is derived, not chosen first --
# it is the intersection of what the actual dependencies support (chiefly
# the A2c array library and renderer), computed once those are decided,
# not asserted ahead of them. 3.14 was set here provisionally before A2c
# existed and re-derived, still at 3.14, once CuPy/PyTorch/jaxlib were all
# confirmed to ship cp314 wheels the same day -- the number held, the
# reasoning was fixed. After the initial derivation, ongoing policy is
# periodic review: check whether a newer Python benefits PyFlow, upgrade
# when it does, not a fixed floor and not continuous tracking either.
# PyFlow has no external consumers yet, so upgrading stays cheap; revisit
# this whole policy the moment someone else depends on PyFlow. See
# docs/practices.md. Keep this in step with the ruff and mypy settings
# below, and with the CI matrix.
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
# Compute-and-rendering stack, per adr/ADR-004 (class) and adr/ADR-005
# (instances), decided 2026-08-15. No version pins yet -- that is B2's
# job once TASK-000 exists and uv.lock can be generated against real code.
dependencies = [
    "torch",
    "pygfx",
    "pyyaml",
    "glfw",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "pre-commit",
    "types-pyyaml",
    # Test files (tests/golden/test_empty_window.py, D5) import numpy
    # directly for pixel-array assertions. It was already resolved
    # transitively (torch/pygfx both depend on it), which is why this
    # worked before it was declared -- found and fixed 2026-08-16 while
    # touching this file for something else: relying on a transitive
    # dependency's continued presence for something we import directly
    # is fragile, so it's declared explicitly now, in `dev` since
    # nothing under src/pyflow imports it (yet).
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyflow"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
# tools/validators and tools/generators are here (not just "src") so
# tests/unit/test_check_docs.py and tests/unit/test_generate_docs_index.py
# can `from check_docs import ...` / `from generate_docs_index import ...`
# and have mypy resolve them -- neither script is part of the pyflow
# package, but their tests still need static checking (2026-08-17,
# generate_docs_index.py added same day as check_docs.py).
mypy_path = ["src", "tools/validators", "tools/generators"]
packages = ["pyflow"]
strict = true

# pygfx and rendercanvas (wgpu's canvas layer, adr/ADR-005) ship no
# py.typed marker and have no stub package on PyPI as of 2026-08-16 --
# unlike pyyaml (types-pyyaml, dev dependency) this isn't fixable by
# adding stubs. Scoped narrowly to these two rather than a blanket
# ignore_missing_imports, so a real missing-stub regression elsewhere
# still fails loudly.
[[tool.mypy.overrides]]
module = ["pygfx.*", "rendercanvas.*"]
ignore_missing_imports = true

# pytest.mark.parametrize (first used 2026-08-16,
# tests/integration/test_import_order.py) trips --strict's
# disallow_untyped_decorators: pytest's own stubs don't preserve the
# decorated function's signature precisely enough for mypy to consider it
# typed. A known, common mypy+pytest interaction, not a real typing gap
# in our code -- scoped to test modules only, so src/ keeps full strict
# decorator checking. (No `tests.*` prefix: tests/ has no `__init__.py`
# of its own, only its subdirectories do, so mypy resolves these as
# `unit.*`/`integration.*`/etc., not `tests.unit.*`.)
[[tool.mypy.overrides]]
module = ["unit.*", "integration.*", "golden.*", "performance.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pyflow --cov-report=term-missing"

[tool.coverage.run]
source = ["src/pyflow"]
branch = true

[tool.coverage.report]
# No fail-under threshold yet -- there is one real test (C1a) and almost
# no implementation to cover. Set one once there's enough real code for a
# number to mean something rather than be gamed by trivial modules.
skip_empty = true

# Structural gap, not a bug: tests/integration/test_cli.py and
# test_bootstrap.py deliberately invoke `python -m pyflow` as a real
# subprocess (tests/integration/CLAUDE.md), so pytest-cov -- which only
# instruments the in-process interpreter -- can't see into them.
# Resolved for __main__.py and bootstrap.py specifically (2026-08-16,
# maintainer's request) by adding complementary in-process tests
# (tests/unit/test_main.py, test_bootstrap.py) that call main()/
# bootstrap() directly rather than via subprocess -- not a replacement
# for the subprocess tests, which still verify the real packaged entry
# point; the unit tests exist purely so coverage.py has something to
# measure. The underlying limitation (coverage.py can't see subprocess
# execution without COVERAGE_PROCESS_START + a sitecustomize.py) still
# applies to any *future* subprocess-only test -- prefer the same
# "complementary in-process test" pattern over that heavier setup unless
# a module can only be exercised via subprocess.

[tool.codespell]
# Added 2026-08-18 with the codespell pre-commit hook. Skip generated and
# lock files; `docs/index.md` is generated (root CLAUDE.md forbids editing
# it by hand), and uv.lock is machine-written.
skip = "uv.lock,docs/index.md,.git,.venv,*.pyc"
# Every entry below silences a word codespell would otherwise flag, and each
# one earned its place on the hook's first real run -- nothing here is
# speculative. Keep it that way: an entry added "just in case" is an entry
# that will one day hide a real typo.
#   yau            -- Rogers & Yau, the standard cloud-physics text, cited by
#                     docs/handbook/physics/{humidity,cloud-formation}.md
#   pre-empt,      -- British hyphenated forms; this repository uses British
#   pre-emptively,    English throughout (visualisation, behaviour, optimise)
#   re-using
#   architechture  -- a former filename, corrected 2026-08-15. It survives in
#                     docs/CHANGELOG-DESIGN.md, which is append-only by
#                     convention and must keep the record as written.
ignore-words-list = "yau,pre-empt,pre-emptively,re-using,architechture"
