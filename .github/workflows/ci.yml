# TASK-004 (docs/planning/roadmap.md). Invokes `make ci` rather than
# restating the lint/typecheck/test sequence here, so the workflow and
# local verification can't drift apart (P-011, docs/practices.md).
#
# Matrix is Linux + Windows deliberately (maintainer's call, 2026-08-16):
# development happens on Windows, runners default to Linux, and that
# split is exactly where `make` behaviour and headless rendering (D5)
# diverge -- a green pipeline on one platform would say nothing about
# the other. macOS is not included; nothing has asked for it yet.
name: CI

on:
  push:
    # Branch renamed master -> main 2026-08-19 (docs/planning/backlog.md
    # F1) -- no remote and no collaborators yet made this free to do now,
    # cheaper than after a remote's default branch exists.
    branches: [main]
  pull_request:

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version-file: ".python-version"
          enable-cache: true

      # windows-latest does not ship GNU Make -- Git for Windows doesn't
      # bundle it either (docs/planning/backlog.md A1b found the same gap
      # on the local dev machine). Installed the same way it was there:
      # Chocolatey, which GitHub's windows-latest image preinstalls.
      # ubuntu-latest ships GNU Make already (build-essential), so no
      # equivalent step is needed on Linux.
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y

      # ubuntu-latest has no GPU, so wgpu needs a software Vulkan adapter
      # (LavaPipe) to run at all -- even the offscreen backend
      # (tests/unit/test_rendering.py, D3) creates a real wgpu device.
      # windows-latest needs nothing extra: it has a software D3D12 (WARP)
      # adapter built into the OS, which wgpu falls back to automatically.
      # This package set is standard practice for wgpu/pygfx's own CI per
      # the 2026-08-15 survey (docs/architecture/compute-and-rendering-stack.md).
      #
      # First real run (2026-08-19) hung here for 8+ minutes. First
      # diagnosis (needrestart's interactive restart-services prompt) was
      # a plausible guess made without log access and turned out wrong --
      # NEEDRESTART_MODE/DEBIAN_FRONTEND below changed nothing, kept as
      # harmless defence in depth, not the actual fix. The maintainer
      # pasted the real log: `apt-get update` itself was the slow step,
      # stuck retrying `azure.archive.ubuntu.com` (GitHub's Azure-runner
      # regional mirror, periodically flaky) four times before falling
      # back to `archive.ubuntu.com` directly -- a documented GitHub
      # Actions gotcha, not this package set's fault. Fixed by pointing
      # `/etc/apt/apt-mirrors.txt` (the mirror list Ubuntu 24.04's
      # `mirror+file:` sources resolve through) straight at the reliable
      # direct archive, skipping the flaky regional mirror entirely.
      - name: Install software Vulkan driver (Linux)
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          echo "http://archive.ubuntu.com/ubuntu" | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 mesa-vulkan-drivers

      - name: make install
        run: make install

      # **No `xvfb` here, and that is a recorded decision rather than an
      # omission** -- so the 10 display-guarded tests
      # (`@_needs_a_real_display` in `tests/integration/
      # test_interactive_window.py` and `test_playback_cli.py`) skip on
      # Linux and run only on Windows. Without a `DISPLAY`,
      # `_display_available()` short-circuits before GLFW is ever
      # constructed (deliberately: GLFW hard-aborts the process rather
      # than raising, see `tests/integration/CLAUDE.md`).
      #
      # **Tried and reverted 2026-09-11/12 by the Stage 8 exit audit.**
      # Installing `xvfb` and running `xvfb-run -a make ci` does work --
      # Linux skips dropped from 29 to 18, matching a local run, so all
      # 10 tests genuinely ran. It was reverted because it made the
      # Linux job flaky: across three attempts on identical test code,
      # two passed and one crashed an xdist worker outright, with no
      # Python traceback (the hard process abort GLFW produces), and the
      # crashed one then passed on a plain re-run. 8 workers creating
      # software-GL contexts against one Xvfb display concurrently is the
      # working hypothesis, never reproduced locally.
      #
      # **Serialising the display tests onto one worker
      # (`--dist loadgroup`) is not the fix, and made things worse**: it
      # hung the *Windows* job for 5h45m until GitHub's own 6-hour limit
      # killed it, at 95% with ~6 tests outstanding and an orphaned
      # python process at cleanup. One process creating ~15 GLFW windows
      # in sequence is the failure that buys; 1-2 per process spread
      # across workers is what has always worked. See
      # `docs/planning/backlog.md` for the open item.
      - name: make ci
        env:
          # Runs with more test parallelism than a local `make test`
          # (Makefile's own `PYTEST_WORKERS ?= 4` default) -- CI runs on
          # dedicated runner hardware where oversubscribing workers has
          # paid off in practice, unlike a developer's own machine, which
          # is doing other things at the same time. See the Makefile's
          # own comment on `PYTEST_WORKERS` for why this is an env var
          # here rather than a second hardcoded command.
          PYTEST_WORKERS: "8"
        run: make ci
