# Hook versions below were current as of 2026-08-15 (verified against each
# repo's GitHub releases/tags directly). Bump periodically -- `pre-commit
# autoupdate` handles this.
#
# Run via `make lint` (see the Makefile's comment above that target for
# what each hook does). Exercised against real source for the first time
# 2026-08-15 (backlog B4) -- fixed two files missing a trailing newline,
# clean on the second run. Keep the Makefile's hook-list comment in sync
# if hooks are added, removed or reordered here (Blast Radius,
# docs/practices.md).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      # Added 2026-08-18. A stray carriage return mid-line registers as a
      # CR-terminated line among LF ones, so this catches the escape-mangling
      # that corrupted `$\rho$` into `$ho$` during the documentation review --
      # see docs/handbook/CLAUDE.md's notation section. `--fix=no` is
      # deliberate: auto-fixing turns the stray CR into a real line break,
      # replacing one silent corruption with another and reporting success.
      - id: mixed-line-ending
        args: [--fix=no]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      # Added 2026-08-18. ~18k lines of prose; this is the cheap half of
      # proofreading. Domain terms it doesn't know go in the ignore list in
      # pyproject.toml's [tool.codespell] rather than being skipped wholesale.
      - id: codespell
        additional_dependencies: [tomli]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        additional_dependencies: [types-pyyaml]
