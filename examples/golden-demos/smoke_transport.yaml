# Smoke Transport golden demo (Stage 6, TASK-038) --
# `docs/planning/implementation-plan.md` Level 3's own Golden Demo list,
# `planning/data/demos.yaml`'s `demo-smoke-transport`: "Passive tracers
# carried by a solved velocity field, with no effect on it."
#
# Run it exactly the way any user would:
#
#   uv run python -m pyflow run --config examples/golden-demos/smoke_transport.yaml
#
# The same lid-driven-cavity shape `lid_driven_cavity.yaml` already
# proved stable (mesh, timestep, viscosity, moving north wall) plus one
# declared `smoke` field (`fields:`, TASK-042) -- `bootstrap.py`'s
# `_add_declared_field_transport` already supports a declared field
# alongside solved velocity generically (built for TASK-042, exercised
# by `thermal_buoyancy.yaml` the same way), so nothing in `bootstrap.py`
# needed to change to run this demo. Unlike Thermal Buoyancy, `smoke`
# carries no buoyancy coupling and `numerics.source_term` stays at its
# default ("none") -- the whole point of this demo is that a transported
# field can ride along with a solved flow and leave it untouched; the
# exactness of that claim is proven at the engine level by
# `tests/features/passive_tracers.feature`, not re-proven here.

mesh:
  extent: [16, 16]
  spacing: [0.0625, 0.0625]

numerics:
  timestep: 0.008
  boundary_conditions:
    north:
      type: dirichlet
      field_values:
        velocity.0: 1.0
        velocity.1: 0.0
    south:
      type: dirichlet
    east:
      type: dirichlet
    west:
      type: dirichlet

fields:
  - name: smoke
    initial_condition: gaussian_blob
    diffusion_coefficient: 0.01

simulation:
  velocity_solved: true

fluid:
  viscosity: 0.01

field_display:
  low_color: "#0a0a2a"
  high_color: "#e8e8ff"
  # `_add_declared_field_transport` also draws the solved velocity
  # carrying `smoke` as arrows now (added 2026-09-09, closing the gap
  # `playback.py`'s own combined `play()` path, TASK-051, flagged) --
  # P-019 requires the same name-the-quantity treatment
  # `lid_driven_cavity.yaml`'s own arrows already get.
  vector_label: Velocity (model units)
  # Two modular panels (`field_display.panels`), both showing the same
  # `smoke` field -- added at a user's direct request after watching
  # this exact demo: smoke decays toward zero over the run, and a fixed
  # [0, 1] linear range washes that decay into a single near-black shade
  # long before the field has actually vanished. See `src/pyflow/
  # rendering/CLAUDE.md`'s "Equalized (rank-based) field panel" entry
  # for the full design history (two magnitude-based scales -- log10,
  # then percentile-trimmed log10 -- were tried and rejected first) and
  # why keeping the plain linear panel alongside the equalized one, not
  # replacing it, matters: it's what makes the equalized panel's own
  # adaptive range legible as *adaptive* rather than just "the demo's
  # colours changed". The panel list itself (not just the equalized mode)
  # was added the same day, at a further user request for each panel's
  # visibility to be independently configurable, and for a future run to
  # be able to show *different* fields side by side, not only one field
  # coloured two ways.
  panels:
    - field: smoke
      value_range: [0.0, 1.0]
      # Stage 7 (Rendering Annotations): named on screen, same reasoning
      # as every other demo's own panel label -- "model units" since
      # nothing calibrates this to a real smoke-density unit.
      label: Smoke concentration (model units)
    - field: smoke
      mode: equalized

rendering:
  title: Smoke Transport
  background_color: "#1a1a2e"
