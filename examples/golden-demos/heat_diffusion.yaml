# Heat Diffusion golden demo (Stage 5, TASK-034) -- Stage 5's own
# reconciliation of `docs/implementation/mvp.md`'s Validation section
# (2026-08-28, maintainer's call): heat diffusion *is* the diffusion
# equation on a transported scalar, with no named Temperature field
# needed (that field, and its buoyancy coupling, is Stage 6's TASK-035,
# a genuinely different claim).
#
# A single sinusoidal mode, one full wavelength across the mesh's own
# x-extent, decays exponentially at a rate set only by the field's own
# diffusion coefficient (`fields:`, `FieldConfig`, TASK-042) and the
# mode's own wavenumber -- an exact, checkable answer
# (`tests/features/heat_diffusion.feature`), not just "heat visibly
# spreads". No velocity at all (`SimulationConfig.velocity_pattern`
# unset): this demo is pure diffusion, the reading
# `docs/handbook/numerical-methods/diffusion.md` describes for a single
# mode on a periodic domain. `field_display.render_field` names the
# declared field the live colour map shows.
#
# Run it exactly the way any user would:
#
#   uv run python -m pyflow run --config examples/golden-demos/heat_diffusion.yaml
#
# Every boundary is periodic: the mode has no y-dependence, so north/
# south's own periodicity is never exercised by the flow, but a
# transported field still needs *some* configured condition on every
# edge regardless, and periodic is what keeps the domain's own physical
# picture (an unbounded medium carrying one Fourier mode) honest rather
# than introducing an artificial wall the closed-form solution assumes
# away.

mesh:
  extent: [24, 8]
  spacing: [0.125, 0.125]

numerics:
  timestep: 0.01
  boundary_conditions:
    north:
      type: periodic
    south:
      type: periodic
    east:
      type: periodic
    west:
      type: periodic

fields:
  - name: tracer
    initial_condition: sinusoidal_mode
    diffusion_coefficient: 0.05

field_display:
  render_field: tracer
  low_color: "#0a0a2a"
  high_color: "#ff4400"
  value_range: [-1.0, 1.0]
  # Stage 7 (Rendering Annotations): named on screen, not just "tracer"
  # (real feedback: "isn't sufficient"). Not a real thermal unit -- this
  # is an anonymous diffusing scalar mode (`heat_transport.yaml` is the
  # demo with a real-named `temperature` field), so the label says
  # "model units" rather than implying a calibrated Kelvin value.
  field_label: Diffusing scalar amplitude (model units)

rendering:
  title: Heat Diffusion
  background_color: "#1a1a2e"
