# Field Rendering golden demo (Stage 2, TASK-017): "display scalar and
# vector fields".
#
# The whole demo IS this file -- there is no demo-specific code. Run it
# exactly the way any user would, through the public CLI:
#
#   uv run python -m pyflow run --config examples/golden-demos/field_display.yaml
#
# `scalar_pattern`/`vector_pattern` are the small, closed set of built-in
# patterns FieldDisplayConfig offers for a demo like this -- distinct
# from Field's own general-callable Python API real simulation code
# uses (TASK-015/016). `radial_gradient` colours each cell by its
# distance from the mesh's centre; `rotational` gives each cell a
# tangential velocity around that same centre, so the two fields share
# one visual centre and the vector field is genuinely non-uniform in
# both direction and magnitude.
#
# `rendering.width`/`height` are chosen so the canvas aspect ratio
# exactly matches the framed view (the mesh's bounding box, the legend
# strip below it, and -- since Stage 7, Rendering Annotations -- the
# title above and the stats/legend-label margins below, all widened by
# fit_camera_to_bounds' 10% margin) -- 250:395 = 50:79 -- so pygfx's
# aspect-preserving camera (`maintain_aspect`) needs no correction to
# make on-screen pixel positions predictable. Chosen for
# hand-checkability, the same reason `empty_mesh.yaml` uses a small
# mesh; not a claim that a real user needs this exact resolution.
# Was 250:290 (25:29) before Stage 7 added the HUD margins; recomputed,
# not guessed -- see `tests/golden/test_field_display.py`'s own
# `_FRAMED_BOUNDS`/`_CANVAS` for the exact arithmetic, verified by
# running the per-cell/legend pixel checks against it.

mesh:
  extent: [3, 3]

field_display:
  scalar_pattern: radial_gradient
  vector_pattern: rotational
  low_color: "#0a141e"
  high_color: "#c89664"
  value_range: [0.0, 2.5]
  arrow_color: "#00ff88"
  arrow_scale: 0.3
  show_legend: true
  # Stage 7 (Rendering Annotations): both synthetic demo patterns named
  # explicitly on screen, not left for a viewer to guess at -- real
  # feedback on the first cut of this feature ("Presumably this is the
  # representation of some Field? That should be explicit"). Neither is
  # a real physical quantity, so neither claims a unit `radial_gradient`
  # doesn't have (it *is* a plain Euclidean distance in mesh units,
  # which "Distance from centre" already says without inventing "(m)").
  field_label: Distance from centre
  vector_label: Rotational vector (demo pattern)

rendering:
  title: Field Display
  width: 250
  height: 395
  background_color: "#000000"
