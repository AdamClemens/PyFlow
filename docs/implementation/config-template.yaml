# Configuration template -- every PyFlowConfig field, with a comment
# above each one stating what counts as a valid value and what does
# not.
#
# GENERATED by tools/generators/generate_config_template.py from
# src/pyflow/configuration/schema.py. Do not edit by hand -- per root
# CLAUDE.md, generated documentation is never edited manually, and
# `make check-config-template` fails if this file is stale relative to
# the live schema. To change what appears here, change schema.py (the
# value shown) or this script's FIELD_COMMENTS/SECTION_COMMENTS (the
# explanation), then run `make config-template`.
#
# Every value below is PyFlowConfig()'s own default -- this file is a
# real, loadable configuration (see
# tests/unit/test_generate_config_template.py), not a set of
# placeholder tokens that would fail `pyflow run --config` if used
# as-is. Copy it and edit the fields you actually want to change; a
# field left out of your own config file simply keeps its default.
#
# For a plain scaffold with no comments, `uv run python -m pyflow
# generate-config` produces the same defaults directly from the schema.

# Logging framework settings.
logging:
  # Valid: one of DEBUG, INFO, WARNING, ERROR, CRITICAL (case-insensitive).
  # Invalid: any other string, e.g. "VERBOSE".
  level: INFO

# Rendering window/canvas settings.
rendering:
  # Valid: "glfw" (a real interactive window) or "offscreen" (renders to an
  # in-memory array, no window -- what CI and golden-demo regression tests
  # use). Invalid: any other string.
  backend: glfw
  # Valid: a positive integer, in pixels. Invalid: zero, negative, or a
  # float.
  width: 1280
  # Valid: a positive integer, in pixels. Invalid: zero, negative, or a
  # float.
  height: 720
  # Valid: any string. The window's title bar text.
  title: PyFlow
  # Valid: null (leaves the background unset, pygfx's own default) or a
  # "#RRGGBB" hex string, e.g. "#1a1a2e". Invalid: a colour name ("red"), a
  # short hex ("#fff"), or a string missing the "#".
  background_color: null
  # Valid: true or false. Invalid: anything else -- not a colour or a
  # string.
  show_mesh: false
  # Valid: a "#RRGGBB" hex string -- unlike background_color, this one has
  # no null/off state; show_mesh above is the switch. Invalid: null, or a
  # malformed hex string.
  grid_color: '#4477aa'
  # Valid: a positive number, and within [zoom_min, zoom_max] below.
  # Invalid: zero, negative, or outside that range.
  zoom: 1.0
  # Valid: a pair of finite numbers [x, y] -- a world-space offset from the
  # camera's default centring. Invalid: anything other than exactly two
  # numbers.
  pan: [0.0, 0.0]
  # Valid: a positive number, less than zoom_max. Invalid: zero, negative,
  # or >= zoom_max.
  zoom_min: 0.1
  # Valid: a number greater than zoom_min. Invalid: <= zoom_min.
  zoom_max: 10.0

# Structured Cartesian mesh: where the domain starts, how big one cell is,
# and how many cells there are. There is no single "domain size" field --
# the physical domain is extent * spacing along each axis.
mesh:
  # Valid: a pair of finite numbers [x, y] -- the mesh's own lower-left
  # corner in world space. Invalid: anything other than exactly two numbers.
  origin: [0.0, 0.0]
  # Valid: a pair of positive numbers [dx, dy] -- the physical size of one
  # cell along each axis. Invalid: zero or negative.
  spacing: [1.0, 1.0]
  # Valid: a pair of positive whole numbers [nx, ny] -- the *number of
  # cells* along each axis, not a physical size (a whole number written as a
  # float, e.g. [10.0, 4.0], is fine). Invalid: zero, negative, or
  # fractional, e.g. [10.9, 3.99] -- rejected outright rather than rounded,
  # since silently building a different mesh than the one asked for is worse
  # than refusing.
  extent: [10, 10]

# Static field visualisation for one rendered frame (built-in demo patterns
# only, not a general initial-condition API).
field_display:
  # Valid: null (draw no scalar field) or "radial_gradient", the only built-
  # in pattern this field currently accepts. Invalid: any other string.
  scalar_pattern: null
  # Valid: null (draw no vector field) or "rotational", the only built-in
  # pattern this field currently accepts. Invalid: any other string.
  vector_pattern: null
  # Valid: a "#RRGGBB" hex string. Invalid: null, or a malformed hex string.
  low_color: '#0000ff'
  # Valid: a "#RRGGBB" hex string. Invalid: null, or a malformed hex string.
  high_color: '#ff0000'
  # Valid: a pair [min, max] with max strictly greater than min. Invalid:
  # max <= min.
  value_range: [0.0, 1.0]
  # Valid: a "#RRGGBB" hex string. Invalid: null, or a malformed hex string.
  arrow_color: '#ffffff'
  # Valid: a positive number. Invalid: zero or negative.
  arrow_scale: 0.3
  # Valid: true or false.
  show_legend: true
  # Valid: null (no live field is coloured) or the name of one field
  # declared under fields: below -- the renderer never infers which one to
  # show. Invalid: naming a field fields: does not declare.
  render_field: null

# Valid: a list of per-field declarations, each a mapping with name (a non-
# empty string, not reused by another declaration and not one of the
# reserved names pressure, velocity.0, velocity.1), initial_condition
# (gaussian_blob or sinusoidal_mode), diffusion_coefficient (a positive
# number, this field's own transport coefficient -- distinct from
# fluid.diffusion_coefficient below, which backs any field left undeclared),
# and an optional buoyancy coupling -- buoyancy_reference_value and
# buoyancy_coefficient, both numbers, set together or not at all -- which
# requires both simulation.velocity_solved: true and a numerics.source_term
# that can compute the body force (anything but the default "none").
# Invalid: a duplicate or reserved name, an unrecognised initial_condition,
# a non-positive diffusion_coefficient, only one of the two buoyancy fields
# set, a buoyancy coupling with velocity_solved false, or a buoyancy
# coupling with numerics.source_term left at "none" -- the last of those
# loaded cleanly and silently produced no force at all until the Stage 6
# exit audit (2026-08-31) rejected it. Empty (the default) means the run
# transports no named field.
fields: []

# Live, repeatedly-stepped simulation seeding -- distinct from field_display
# above, which renders one static frame.
simulation:
  # Valid: null or "uniform", the only built-in pattern this field currently
  # accepts. Invalid: any other string.
  velocity_pattern: null
  # Valid: a pair of finite numbers [vx, vy] -- the initial velocity
  # condition either way; whether it stays fixed or is transported afterward
  # is velocity_solved below, not this field. Invalid: anything other than
  # exactly two numbers.
  velocity: [1.0, 0.0]
  # Valid: true or false. false (default): velocity is prescribed -- held at
  # its initial value every frame, Stage 4's own shape. true: velocity is
  # solved -- transported by step alongside any scalar, self-advected by its
  # own value.
  velocity_solved: false

# Physical properties of the simulated fluid -- separate from numerics
# below, which selects numerical schemes and their solver tunables, not
# properties of the fluid those schemes act on.
fluid:
  # Valid: a positive number -- momentum's own diffusion coefficient,
  # distinct from diffusion_coefficient below (a transported scalar's own).
  # Invalid: zero or negative.
  viscosity: 1.0
  # Valid: a positive number (a transported scalar's own diffusivity, Gamma)
  # -- distinct from viscosity above. Invalid: zero or negative. Migrated
  # here from numerics.diffusion_coefficient (TASK-041); a configuration
  # still setting the old field is rejected with a named error, not silently
  # defaulted.
  diffusion_coefficient: 1.0
  # Valid: a pair of finite numbers [gx, gy] -- the run's own gravitational
  # acceleration vector, only meaningful once a field declares a buoyancy
  # coupling (fields above). Invalid: anything other than exactly two finite
  # numbers. Default: [0.0, -9.81], downward on PyFlow's +y-up convention.
  gravity: [0.0, -9.81]

# Numerical scheme selection (adr/ADR-003-modular-numerical-strategies.md)
# plus the physical/solver parameters those schemes take.
numerics:
  # Valid: "first_order_upwind" -- the only scheme PyFlow currently
  # implements for this component. Invalid: any other string.
  advection: first_order_upwind
  # Valid: "central_difference" -- the only scheme PyFlow currently
  # implements for this component. Invalid: any other string.
  diffusion: central_difference
  # Valid: "rk4" -- the only scheme PyFlow currently implements for this
  # component. Invalid: any other string.
  time_integration: rk4
  # Valid: a positive number. Fixed for the whole run -- PyFlow applies no
  # automatic stability/CFL limit, so an unstable choice is not rejected at
  # load time, only at runtime (as diverging values). Invalid: zero or
  # negative.
  timestep: 0.01
  # Valid: "conjugate_gradient" -- the only solver PyFlow currently
  # implements for this component. Invalid: any other string.
  linear_solver: conjugate_gradient
  # Valid: a positive number -- the convergence tolerance. Invalid: zero or
  # negative.
  linear_solver_tolerance: 1.0e-06
  # Valid: a positive integer. Invalid: zero, negative, or a float.
  linear_solver_max_iterations: 1000
  # Valid: "piso" -- the only scheme PyFlow currently implements for this
  # component. Invalid: any other string.
  pressure_coupling: piso
  # Valid: a positive number -- the outer corrector loop's own convergence
  # tolerance (distinct from linear_solver_tolerance above, which governs
  # each inner linear solve, not how many corrector passes the outer loop
  # may take). Invalid: zero or negative.
  pressure_correction_tolerance: 1.0e-06
  # Valid: a positive integer -- the outer corrector loop's own iteration
  # limit. Invalid: zero, negative, or a float.
  pressure_correction_max_iterations: 50
  # Valid: "none" (contributes nothing to any field) or
  # "boussinesq_buoyancy" (the body-force coupling driven by any declared
  # field's own buoyancy_reference_value/buoyancy_coefficient). Invalid: any
  # other string, or "none" while any declared field carries a buoyancy
  # coupling -- that combination has nothing to compute the force it
  # declares.
  source_term: none
  # One entry per domain edge. All four faces share the same shape
  # (BoundaryFaceConfig) and the same per-field rules, explained once below
  # under 'north' and not repeated for the other three.
  boundary_conditions:
    north:
      # Valid: "dirichlet", "neumann", or "periodic". If "periodic", the
      # OPPOSITE face (north<->south, east<->west) must also be "periodic"
      # -- checked jointly across all four faces, not per-face. Invalid: any
      # other string, or a lone periodic face whose pair is not also
      # periodic.
      type: dirichlet
      # Valid: null (not prescribed here) or a number -- the
      # boundary-*normal* component only, positive = outward. A face may
      # prescribe velocity or pressure, never both (see .pressure below); if
      # every one of the four faces prescribes a velocity, they must sum to
      # zero net flux, weighted by each face's physical length. On a
      # periodic face, only null or 0.0 -- a periodic boundary wraps to its
      # pair and reads no prescribed value. Invalid: prescribing both
      # velocity and pressure on one face, a nonzero net flux across all
      # four, or a nonzero velocity on a periodic face.
      velocity: 0.0
      # Valid: null (not prescribed here) or a number. Mutually exclusive
      # with .velocity above on the same face, and must be null on a
      # periodic face. Invalid: any number on a periodic face.
      pressure: null
      # Valid: any finite number -- the Dirichlet value a transported scalar
      # field is given at this face. Only read when type is "dirichlet";
      # harmless but unused when "neumann", and must stay at its 0.0 default
      # when "periodic", which reads no prescribed value at all. Invalid: a
      # nonzero value on a periodic face.
      scalar_value: 0.0
      # Valid: any finite number -- the Neumann gradient a transported
      # scalar field is given at this face. Only read when type is
      # "neumann"; harmless but unused when "dirichlet", and must stay at
      # its 0.0 default when "periodic", which reads no prescribed value at
      # all. Invalid: a nonzero value on a periodic face.
      scalar_gradient: 0.0
      # Valid: a mapping of field name to a finite number -- a per-field
      # override of scalar_value above, e.g. {u: 1.0, v: 0.0} for a moving
      # lid's two velocity components. A field name absent from this mapping
      # falls back to scalar_value. Only read when type is "dirichlet", and
      # must be empty when "periodic". Invalid: a non-finite value, or any
      # entry on a periodic face.
      field_values: {}
      # Valid: a mapping of field name to a finite number -- field_values'
      # own Neumann counterpart, overriding scalar_gradient per field name.
      # Only read when type is "neumann", and must be empty when "periodic".
      # Invalid: a non-finite value, or any entry on a periodic face.
      field_gradients: {}
    south:
      type: dirichlet
      velocity: 0.0
      pressure: null
      scalar_value: 0.0
      scalar_gradient: 0.0
      field_values: {}
      field_gradients: {}
    east:
      type: dirichlet
      velocity: 0.0
      pressure: null
      scalar_value: 0.0
      scalar_gradient: 0.0
      field_values: {}
      field_gradients: {}
    west:
      type: dirichlet
      velocity: 0.0
      pressure: null
      scalar_value: 0.0
      scalar_gradient: 0.0
      field_values: {}
      field_gradients: {}
